name: Auto-Extract and Deploy KawaiiStudy

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Upload zip artifact trigger'
        required: false

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Verify Application Files
        run: |
          echo "Checking app integrity..."
          ls -la
          npm start &
          sleep 2
