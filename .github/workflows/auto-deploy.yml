name: Auto-Extract and Run KawaiiStudy BCN

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      package_note:
        description: 'Manual trigger to extract any uploaded zip archives'
        required: false
        default: 'Extract and run'

jobs:
  unpack-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Any Uploaded Zip Archives
        run: |
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            echo "Found zip archive(s), extracting..."
            unzip -o "*.zip"
            rm -f *.zip
          else
            echo "No zip archives found in root, proceeding with existing files."
          fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Verify Server Startup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-check-key' }}
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/ || exit 1
          kill $SERVER_PID
          echo "KawaiiStudy BCN verified successfully!"
