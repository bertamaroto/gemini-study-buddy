name: Build Android APK & Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate & Test Server
        run: |
          if [ -f "kawaiistudy-bcn-github-apk.zip" ]; then
            unzip -o kawaiistudy-bcn-github-apk.zip
          fi

          if [ -d "server" ]; then
            cd server
            npm install
            node --check server.js
          elif [ -f "server/package.json" ]; then
            cd server
            npm install
            node --check server.js
          elif [ -f "package.json" ]; then
            npm install
            node --check server.js
          else
            echo "No server folder found, skipping check"
          fi

  build-apk:
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p $HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle & Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          cd ${{ github.workspace }}
          
          if [ -f "kawaiistudy-bcn-github-apk.zip" ]; then
            echo "Extracting project ZIP..."
            unzip -o kawaiistudy-bcn-github-apk.zip
          fi

          # Cleanly remove allprojects block from build.gradle without syntax errors
          if [ -f "build.gradle" ]; then
            python3 -c '
            import re
            with open("build.gradle", "r") as f:
                content = f.read()
            content = re.sub(r"allprojects\s*\{[^}]*\}", "", content)
            with open("build.gradle", "w") as f:
                f.write(content)
            print("Successfully removed allprojects block from build.gradle.")
            '
          fi

          if [ ! -f "settings.gradle" ]; then
            echo "Error: settings.gradle not found in root after extraction!"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaiiStudy-BCN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
