name: Build Android APK & Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate & Test Server
        run: |
          if [ -f "kawaiistudy-bcn-github-apk.zip" ]; then
            unzip -o kawaiistudy-bcn-github-apk.zip
          fi

          if [ -d "server" ]; then
            cd server
            npm install
            node --check server.js
          elif [ -f "server/package.json" ]; then
            cd server
            npm install
            node --check server.js
          elif [ -f "package.json" ]; then
            npm install
            node --check server.js
          else
            echo "No server folder found, skipping check"
          fi

  build-apk:
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          
          cd ${{ github.workspace }}
          
          if [ -f "kawaiistudy-bcn-github-apk.zip" ]; then
            echo "Extracting project ZIP..."
            unzip -o kawaiistudy-bcn-github-apk.zip
          fi

          if [ -f "build.gradle" ]; then
            python3 -c '
            with open("build.gradle", "r") as f:
                content = f.read()
            idx = content.find("allprojects")
            if idx != -1:
                open_brace = content.find("{", idx)
                brace_count = 1
                curr = open_brace + 1
                while curr < len(content) and brace_count > 0:
                    if content[curr] == "{":
                        brace_count += 1
                    elif content[curr] == "}":
                        brace_count -= 1
                    curr += 1
                content = content[:idx] + content[curr:]
                with open("build.gradle", "w") as f:
                    f.write(content)
                print("Successfully removed allprojects block from build.gradle.")
            '
          fi

          if [ ! -f "settings.gradle" ]; then
            echo "Error: settings.gradle not found in root after extraction!"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

          echo "Searching for build outputs (APKs / AARs):"
          find . -name "*.apk" -o -name "*.aar"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaiiStudy-BCN-debug-build
          path: |
            app/build/outputs/
            **/*.apk
            **/*.aar
          if-no-files-found: error
