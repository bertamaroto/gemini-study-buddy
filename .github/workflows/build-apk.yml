name: Build Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack Zip (if present) & Verify Workspace
        run: |
          echo "Scanning workspace:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d extracted_source
            shopt -s dotglob
            mv extracted_source/* .
            rm -rf extracted_source "$ZIP_FILE"
            ls -la
          fi

          if [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" -not -path "./settings.gradle" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              PROJECT_DIR=$(dirname "$SUBDIR")
              shopt -s dotglob
              mv "$PROJECT_DIR"/* .
              rmdir "$PROJECT_DIR"
            fi
          fi

          if [ ! -f "settings.gradle" ]; then
            echo "Error: settings.gradle not found!"
            exit 1
          fi

          if [ -d "server" ]; then
            cd server
            npm install
            node --check server.js
          fi

      - name: Build Debug APK
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          
          cd ${{ github.workspace }}

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          cp app/build/outputs/apk/debug/app-debug.apk KawaiiStudyBCN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaiiStudyBCN-APK
          path: KawaiiStudyBCN.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "🌸 Kawaii Study BCN - Latest Android APK"
          body: "Download `KawaiiStudyBCN.apk` directly below and install it on your Android device."
          files: KawaiiStudyBCN.apk
          overwrite: true
