name: Build Android APK & Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate & Test Server
        run: |
          if [ -d "server" ]; then
            cd server
            npm install
            node --check server.js
          elif [ -f "server/package.json" ]; then
            cd server
            npm install
            node --check server.js
          elif [ -f "package.json" ]; then
            npm install
            node --check server.js
          else
            echo "No server folder found, skipping check"
          fi

  build-apk:
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build APK
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          
          cd ${{ github.workspace }}

          if [ ! -f "settings.gradle" ]; then
            echo "Error: settings.gradle not found in root workspace!"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          echo "Searching for generated APKs:"
          find . -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaiiStudy-BCN-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/app-debug.apk
            **/*.apk
          if-no-files-found: error
